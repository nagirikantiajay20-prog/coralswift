# Render Blueprint for the Coral Swift frontend (Admin Console + Partner Portal, one static site).
# Security headers are documented in docs/SECURITY_HEADERS.md. If the service already exists in the
# Render dashboard, either link this Blueprint or copy the headers/rewrite there by hand.
services:
  - type: web
    runtime: static
    name: coralswift-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Public value, baked into the bundle at build time. The build fails unless it is https.
      - key: VITE_API_BASE_URL
        value: https://coralswift-backend.onrender.com
      - key: NODE_VERSION
        value: "22"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://coralswift-backend.onrender.com; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests"
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
